<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>大丸・松坂屋</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-daimaru-192.png">
  <link rel="icon" sizes="192x192" href="icon-daimaru-192.png">
  <link rel="icon" sizes="512x512" href="icon-daimaru-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-daimaru-180.png">
  <link rel="apple-touch-icon" href="icon-daimaru-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="大丸・松坂屋">
  <meta name="application-name" content="大丸・松坂屋">
  <meta name="theme-color" content="#ffffff">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
  <meta name="referrer" content="no-referrer">
  <style>
    html {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      padding: 0;
      /* 整页钉死：不能手指滑动、不回弹、不缩放 */
      position: fixed;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #fff;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .page {
      display: none;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .page.active {
      display: block;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    /* page1 点击区域 */
    #page1 .click-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
      pointer-events: auto;
    }
    /* page4 右侧 1/3 点击区域 */
    #page4 .right-third-click {
      position: absolute;
      top: 0;
      right: 0;
      width: 33.33%;
      height: 100%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
      pointer-events: auto;
    }
    /* 原有点击区域样式保留 */
    .page2-coupon-click, .page3-notice-area, #page6 .click-area {
      pointer-events: auto;
    }
    .btn-area {
      display: none;
    }
    .page2-coupon-click {
      position: absolute;
      top: 84%;
      left: 0;
      width: 100%;
      height: 12%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
    }
    .next-btn {
      position: absolute;
      background-color: rgba(44, 62, 80, 0.8);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      z-index: 20;
      top: 10px;
      right: 10px;
      pointer-events: auto;
    }
    /* ── 张数弹窗：照官方样式 1:1 ── */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: auto;
    }
    .modal-content {
      background-color: #fff;
      padding: 30px 22px 24px;
      border-radius: 10px;
      width: 63%;
      min-width: 270px;
      max-width: 330px;
      text-align: center;
      position: relative;
      box-sizing: border-box;
      font-family: "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    }
    .modal-content p {
      font-weight: 600;
      font-size: 16px;
      color: #16222e;
      margin: 2px 0 20px;
    }
    .close-modal {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: #1c2b39;
      color: #fff;
      font-size: 15px;
      line-height: 30px;
      text-align: center;
      cursor: pointer;
      box-sizing: border-box;
      padding: 0;
    }
    .count-row {
      margin: 0 0 16px;
      line-height: 1;
    }
    .cnt-num {
      font-size: 30px;
      font-weight: 700;
      color: #16222e;
      letter-spacing: 0;
    }
    .cnt-unit {
      font-size: 14px;
      color: #16222e;
      margin-left: 7px;
    }
    .stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 36px;
      margin: 0 auto 26px;
      background-color: #ececec;
      border-radius: 6px;
      overflow: hidden;
    }
    .stepper button {
      flex: 1 1 50%;
      height: 100%;
      border: none;
      background-color: transparent;
      color: #4a4a4a;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      border-radius: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.08s ease;
    }
    /* 物理按键感：按下时键面变灰 */
    .stepper button:active {
      background-color: #c7c7c7;
    }
    .step-divider {
      flex: 0 0 1px;
      width: 1px;
      height: 20px;
      background-color: #d5d5d5;
    }
    .confirm-btn {
      display: block;
      width: 100%;
      height: 44px;
      background-color: #1c2b39;
      color: #fff;
      border: none;
      border-radius: 22px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .confirm-btn:active {
      background-color: #2e4256;
    }
    /* ── 注意事项弹窗：与张数弹窗同一层背景（page2 不变），仅换卡片内容 ── */
    .notice-card {
      background-color: #fff;
      padding: 30px 19px 27px;
      border-radius: 12px;
      width: 65%;
      min-width: 280px;
      max-width: 340px;
      box-sizing: border-box;
      position: relative;
      font-family: "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    }
    .nt-title {
      margin: 0 0 18px;
      font-size: 16px;
      font-weight: 700;
      line-height: 20px;
      color: #29333f;
      text-align: center;
    }
    .nt-body {
      margin: 0;
      padding: 0;
      text-align: left;
    }
    .nt-body p {
      margin: 0;
      font-size: 13px;
      line-height: 17px;
      color: #2f3c4b;
      padding-left: 19px;
      text-indent: -19px;
    }
    .nt-btn {
      display: block;
      width: 100%;
      height: 42px;
      margin: 22px 0 0;
      background-color: #222f3e;
      color: #fff;
      border: none;
      border-radius: 21px;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .nt-btn:active { background-color: #36455a; }
    .nt-cancel {
      display: block;
      margin: 21px auto 0;
      padding: 2px 10px;
      background: none;
      border: none;
      font-size: 13.5px;
      font-weight: 700;
      color: #29333f;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .nt-cancel:active { opacity: .55; }
    .barcode-page {
      position: relative;
    }
    /* 日期时间：竖排（rotate -90），日期和倒计时分居图中时钟图标两侧，JS 精确对位 */
    .time-display {
      position: absolute;
      top: 80%;
      left: 14%;
      display: flex;
      align-items: center;
      gap: 0.55em;
      color: #888;
      background-color: transparent;
      z-index: 10;
      transform: rotate(-90deg);
      transform-origin: top left;
      font-weight: 400;
      white-space: nowrap;
      pointer-events: none;
      line-height: 1;
      font-family: "PingFang SC", "Helvetica Neue", "Microsoft YaHei", "Heiti SC", sans-serif;
    }
    .td-date {
      font-size: 5.5vw;
      letter-spacing: -0.02em;
    }
    .td-gap {
      /* 让出图中自带的时钟图标位置 */
      flex: 0 0 auto;
      width: 6.6vw;
      align-self: center;
    }
    .td-time {
      font-size: 4.7vw;
      color: #667380;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }
    .td-time.expired {
      color: #ff0000;
    }
    #page3, #page6 {
      text-align: center;
      padding: 20px 0;
      position: relative;
    }
    #page3 img, #page6 img {
      max-width: 100%;
      margin: 0 auto;
    }
    .page3-notice-area {
      position: absolute;
      top: 40%;
      left: 10%;
      width: 80%;
      height: 30%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
    }
    /* 利用枚数 数字：数字直接绘制在 canvas 上，并在同一 canvas 内实测墨迹后精确居中，
       测量与渲染同源 → 任何设备/字体下墨迹中心都精确落在官方位置（不再依赖跨引擎字体度量）。
       官方目标（page6.png 1320 原图实测）：墨迹中心 x=281/1320=21.2879vw、y=858/1320=64.9985vw，墨迹高 75/1320=5.6818vw
       canvas 为 12vw 正方形、中心对准目标（旋转 -90° 关于中心旋转，中心不动），故 left/top = 目标 - 6vw */
    .qty-num {
      position: absolute;
      width: 12vw;
      height: 12vw;
      left: 15.288vw;   /* 21.2879 - 6 */
      top: 58.999vw;    /* 64.9985 - 6 */
      transform: rotate(-90deg);
      margin: 0;
      padding: 0;
      display: block;
      /* 字体：官方字形为日系黑体（Meiryo Bold 最接近），iOS 对应 Hiragino Sans */
      font-family: "Hiragino Sans", "HiraginoSans-W6", "Hiragino Kaku Gothic ProN", "Meiryo", "Yu Gothic", sans-serif;
      font-size: 7.412vw;   /* 仅作为字号初值；真实字号由 JS 在 canvas 内按墨迹高反算 */
      font-weight: 700;
      color: #2f3c4b;
      z-index: 10;
      pointer-events: none;
    }
    /* page6点击区域 */
    #page6 .click-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
    }
    /* page7点击区域（使用完成 → 点任意位置回首页） */
    #page7 .click-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
      pointer-events: auto;
    }
    /* page4 与 page6 共用 .time-display（见上），无需重复定义 */

    @media (max-width: 768px) {
      /* 字号已用 vw，随宽度自适应，无需覆写 */
    }

    /* ── 添加到主屏幕提示条（仅在浏览器中打开时出现，桌面图标启动时不显示） ── */
    #installTip {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 200;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      box-sizing: border-box;
      background: rgba(28, 38, 51, .94);
      color: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .28);
      font-family: "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.4;
      transition: opacity .25s ease, transform .25s ease;
    }
    #installTip.show { display: flex; }
    #installTip.hide { opacity: 0; transform: translateY(12px); }
    #installTip .it-ic {
      flex: 0 0 34px; width: 34px; height: 34px; border-radius: 8px;
      background: #fff url('icon-daimaru-180.png') center/contain no-repeat;
    }
    #installTip .it-tx { flex: 1 1 auto; }
    #installTip .it-tx b { display: block; font-size: 13px; font-weight: 600; }
    #installTip .it-tx span { display: block; font-size: 11.5px; opacity: .78; margin-top: 2px; }
    #installTip .it-btn {
      flex: 0 0 auto; border: 0; border-radius: 999px; padding: 7px 12px;
      background: #d8cb84; color: #2b3d4f; font-size: 12.5px; font-weight: 700;
      cursor: pointer; pointer-events: auto;
    }
    #installTip .it-close {
      flex: 0 0 auto; border: 0; background: transparent; color: rgba(255,255,255,.6);
      font-size: 20px; line-height: 1; padding: 0 2px; cursor: pointer; pointer-events: auto;
    }
    #installGuide {
      position: fixed; inset: 0; z-index: 300; display: none;
      background: rgba(0,0,0,.55); align-items: flex-end; justify-content: center;
    }
    #installGuide.show { display: flex; }
    #installGuide .ig-box {
      width: 100%; max-width: 420px; background: #fff; color: #2b3d4f;
      border-radius: 16px 16px 0 0; padding: 18px 18px calc(20px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box; font-family: "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    }
    #installGuide h4 { margin: 0 0 10px; font-size: 16px; }
    #installGuide ol { margin: 0; padding-left: 20px; font-size: 13.5px; line-height: 1.9; }
    #installGuide .ig-close {
      margin-top: 14px; width: 100%; border: 0; border-radius: 10px; padding: 12px;
      background: #2b3d4f; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page active" id="page1">
    <img 
      src="page1.jpg" 
      alt="优惠券列表" 
    >
    <div class="click-area" onclick="switchPage('page1', 'page2')"></div>
  </div>

  <div class="page" id="page2">
    <img 
      src="page2.jpg" 
      alt="优惠券详细信息"
    >
    <div 
      class="page2-coupon-click" 
      onclick="openCouponModal()"
    ></div>
  </div>

  <div class="page" id="page4">
    <!-- 右侧1/3点击区域，直接跳转page6 -->
    <div class="right-third-click" onclick="switchPage('page4', 'page6')"></div>
    <div class="barcode-page">
      <img
        src="page4.png"
        alt="优惠券条码"
      >
      <!-- 利用枚数数字（图中「利用枚数 _ 枚」烤死数字已擦除，与张数联动）
           page4.png 是官方 1320 原图的 0.7083 缩放版，两张图 vw 坐标完全一致，
           故与 page6 共用同一官方目标：墨迹中心 x=281/1320=21.2879vw、y=858/1320=64.9985vw，墨迹高 75/1320=5.6818vw -->
      <canvas class="qty-num" id="qtyNum" data-cx="21.2879" data-cy="64.9985" data-inkh="5.6818" data-q="1">1</canvas>
      <div class="time-display" id="page4TimeDisplay"></div>
    </div>
  </div>

  <!-- 新增page6页面 -->
  <div class="page" id="page6">
    <img
      src="page6.png"
      alt="优惠券使用完成页"
    >
    <!-- 利用枚数数字（page6 图中「利用枚数 _ 枚」烤死数字已擦除，与张数联动）
         官方墨迹中心 x=281/1320=21.2879vw、y=858/1320=64.9985vw，墨迹高 75/1320=5.6818vw -->
    <canvas class="qty-num" id="qtyNum6"
            data-cx="21.2879" data-cy="64.9985" data-inkh="5.6818" data-q="1">1</canvas>
    <div class="time-display" id="page6TimeDisplay"></div>
    <div class="click-area" onclick="switchPage('page6', 'page7')"></div>
  </div>
  
  <div class="page" id="page7">
    <img 
      src="page7.jpg" 
      alt="优惠券使用完成页"
    >
    <div class="click-area" onclick="switchPage('page7', 'page1')"></div>
  </div>

  <div class="modal" id="couponModal">
    <div class="modal-content">
      <span class="close-modal" id="closeModal" onclick="closeCouponModal()">&times;</span>
      <p>请选择要使用的张数。</p>
      <div class="count-row">
        <span class="cnt-num" id="couponCount">1</span><span class="cnt-unit">张</span>
      </div>
      <div class="stepper">
        <button id="decrease" type="button" aria-label="减少">−</button>
        <div class="step-divider"></div>
        <button id="increase" type="button" aria-label="增加">+</button>
      </div>
      <button class="confirm-btn" onclick="confirmCoupon()">确定</button>
    </div>
  </div>

  <!-- 注意事项弹窗：背景仍是 page2，与张数弹窗完全同一层，无背景跳动 -->
  <div class="modal" id="noticeModal">
    <div class="notice-card">
      <span class="close-modal" id="noticeClose" onclick="closeNotice(true)">&times;</span>
      <h3 class="nt-title">关于使用优惠券的注意<br>事项</h3>
      <div class="nt-body">
        <p>● 此后将无法返回并进行操作。</p>
        <p>● 优惠券显示后将无法重新发放。</p>
        <p>● 显示时间为 10 分钟。超过显示时间后无法使用。</p>
      </div>
      <button class="nt-btn" onclick="noticeConfirm()">了解上述内容并使用优惠券</button>
      <button class="nt-cancel" onclick="closeNotice(true)">暂不使用</button>
    </div>
  </div>

  <div id="installTip">
    <div class="it-ic"></div>
    <div class="it-tx">
      <b>添加到主屏幕，像 App 一样打开</b>
      <span>名称：大丸・松坂屋　图标与「大丸心斎橋」一致</span>
    </div>
    <button class="it-btn" id="itHow" type="button">方法</button>
    <button class="it-close" id="itClose" type="button" aria-label="关闭">&times;</button>
  </div>

  <div id="installGuide">
    <div class="ig-box">
      <h4>添加到主屏幕的方法</h4>
      <ol id="installGuideText"></ol>
      <button class="ig-close" id="igClose" type="button">知道了</button>
    </div>
  </div>

  <script>
    let countdownInterval; 
    let remainingSeconds = 10 * 60; // 10分钟倒计时
    const TOTAL_SECONDS = remainingSeconds; 

    function switchPage(fromPageId, toPageId) {
      document.getElementById(fromPageId).classList.remove('active');
      document.getElementById(toPageId).classList.add('active');
      
      if (toPageId === 'page4') {
        startCountdown();
      } else if (toPageId === 'page6') {
        updatePage6Time();
      } else {
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
      }
      if (toPageId === 'page4' || toPageId === 'page6') {
        layoutClock();
        /* 数字按「图片实际 rect」定位，而隐藏页(display:none)的 rect 为 0，
           所以切页完成后必须重算一次，否则会停在 CSS 兜底位置（page6 会差 20 CSS px）。 */
        layoutQtyNum();
      }
    }

    function startCountdown() {
      remainingSeconds = TOTAL_SECONDS;
      
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      updatePage4Time(remainingSeconds);
      updatePage6Time();

      countdownInterval = setInterval(() => {
        remainingSeconds--;
        updatePage4Time(remainingSeconds);
        updatePage6Time();

        if (remainingSeconds <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          document.querySelectorAll('.td-time').forEach(function (el) { el.classList.add('expired'); });
          // 倒计时结束自动跳转page6
          switchPage('page4', 'page7');
        }
      }, 1000);
    }

    /* ── 日期时间渲染：日期和倒计时分居图中时钟图标两侧 ── */
    const CLOCK_POS = { x: 0.226, y: 0.6657 }; // 时钟图标在 page4/page6 图中的相对位置（两图实测一致）

    function dateStr() {
      const now = new Date();
      return now.getFullYear() + '/' +
        String(now.getMonth() + 1).padStart(2, '0') + '/' +
        String(now.getDate()).padStart(2, '0');
    }

    function timeHTML() {
      const m = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
      const s = String(remainingSeconds % 60).padStart(2, '0');
      return '<span class="td-date">' + dateStr() + '</span>' +
             '<span class="td-gap"></span>' +
             '<span class="td-time">' + m + ':' + s + '</span>';
    }

    function updatePage4Time(seconds) {
      const now = new Date();
      const ds = now.getFullYear() + '/' +
        String(now.getMonth() + 1).padStart(2, '0') + '/' +
        String(now.getDate()).padStart(2, '0');
      const minutes = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      document.getElementById('page4TimeDisplay').innerHTML =
        '<span class="td-date">' + ds + '</span>' +
        '<span class="td-gap"></span>' +
        '<span class="td-time">' + minutes + ':' + secs + '</span>';
    }

    function updatePage6Time() {
      document.getElementById('page6TimeDisplay').innerHTML = timeHTML();
    }

    /* 把 .td-gap 精确对到图中时钟图标上（日期在下、时间在上） */
    function layoutClock() {
      ['page4TimeDisplay', 'page6TimeDisplay'].forEach(function (id) {
        const el = document.getElementById(id);
        if (!el || !el.innerHTML) return;
        const page = el.closest('.page');
        if (!page || !page.classList.contains('active')) return;
        const img = page.querySelector('img');
        const gap = el.querySelector('.td-gap');
        if (!img || !gap) return;
        const ir = img.getBoundingClientRect();
        const gr = gap.getBoundingClientRect();
        const tx = ir.left + CLOCK_POS.x * ir.width;
        const ty = ir.top + CLOCK_POS.y * ir.height;
        const dx = tx - (gr.left + gr.width / 2);
        const dy = ty - (gr.top + gr.height / 2);
        if (dx || dy) {
          const cs = getComputedStyle(el);
          el.style.left = (parseFloat(cs.left) + dx) + 'px';
          el.style.top = (parseFloat(cs.top) + dy) + 'px';
        }
      });
    }
    window.addEventListener('resize', layoutClock);

    function openCouponModal() {
      document.getElementById('couponModal').style.display = 'flex';
    }

    function closeCouponModal() {
      document.getElementById('couponModal').style.display = 'none';
    }

    /* ── 注意事项弹窗：与张数弹窗共用 page2 背景，X / 暂不使用 可返回重选张数 ── */
    function openNotice() {
      updateQtyDisplay();
      document.getElementById('noticeModal').style.display = 'flex';
    }

    function closeNotice(backToQty) {
      document.getElementById('noticeModal').style.display = 'none';
      if (backToQty) openCouponModal();   /* 回到上一画面，继续选择张数 */
    }

    function noticeConfirm() {
      closeNotice(false);
      switchPage('page2', 'page4');
    }

    const couponCountEl = document.getElementById('couponCount');

    /* ── 「利用枚数 ○ 枚」数字：按真实字体逐像素实测墨迹，精确对齐官方位置（字体无关） ──
       page4 / page6 图中烤死的数字均已擦除，由 .qty-num 动态盖回。
       每个元素用 data-cx / data-cy / data-inkh 声明官方目标（单位 vw，相对图宽），data-q 为要显示的数字。
       为什么改成自绘 canvas：DOM 排版用的字体度量（measureText / line-height / fontBoundingBox）
       与「真实光栅化出来的墨迹」在 iOS 上会差 4~5%（真机上表现为数字错位）。
       只有「测量与渲染用同一个引擎」——即把字画到 canvas 上、再在同一张 canvas 上逐像素扫墨迹——
       才能保证任何设备/任何字体下，墨迹中心都精确落在官方那个空格里。
       另外：data-cx/cy 是**相对图片**的坐标，不能按 .page 定位 —— page6 的 <img> 上方有 20px
       空白文本行盒（图片实际从 y=20 起），按页面定位会整整差 20 CSS px ≈ 1.4 个字符位（v11 修复的主因）。
       下面运行时读 img 的实际 rect 作为原点，任何设备/任何版式都自动对齐。 */
    function drawQtyNum(el) {
      var cx = parseFloat(el.dataset.cx) || 21.2879;
      var cy = parseFloat(el.dataset.cy) || 64.9985;
      var inkHvw = parseFloat(el.dataset.inkh) || 5.6818;
      var txt = el.dataset.q || el.textContent || '1';
      var vw = document.documentElement.clientWidth / 100;
      var dpr = window.devicePixelRatio || 1;
      var cssSize = parseFloat(el.dataset.size) || 12;   /* 与 CSS 的 12vw 保持一致 */

      /* ① 先把 canvas 中心对准「图片坐标系」里的官方目标 */
      var pg = el.closest ? el.closest('.page') : null;
      var img = pg ? pg.querySelector('img') : null;
      var par = el.offsetParent || el.parentElement;
      if (img && par) {
        var ir = img.getBoundingClientRect(), pr = par.getBoundingClientRect();
        if (ir.width > 0) {
          el.style.left = (ir.left - pr.left + cx * vw - cssSize * vw / 2) + 'px';
          el.style.top = (ir.top - pr.top + cy * vw - cssSize * vw / 2) + 'px';
        }
      }
      var size = Math.max(8, Math.round(cssSize * vw * dpr));
      if (el.width !== size || el.height !== size) { el.width = size; el.height = size; }
      var ctx = el.getContext('2d', { willReadFrequently: true });
      if (!ctx) return false;

      var cs = getComputedStyle(el);
      var fam = cs.fontFamily || 'sans-serif';
      var weight = cs.fontWeight || '700';
      var color = cs.color || '#2f3c4b';
      var target = inkHvw * vw * dpr;              /* 目标墨迹高（设备像素，canvas 局部纵向 = 页面横向） */
      var C = size / 2;                            /* canvas 中心；CSS 的 left/top 已把中心对准官方目标 */
      var fs = (parseFloat(cs.fontSize) || (7.412 * vw)) * dpr;
      var ax = C, ay = C;                          /* 文字锚点（textAlign=center / textBaseline=middle） */

      function setFont(px) {
        ctx.font = weight + ' ' + px + 'px ' + fam;
        /* canvas 解析 font 失败时会静默保留旧值（默认 10px sans-serif）→ 数字会变成小字，必须校验 */
        var m = /(\d+(?:\.\d+)?)px/.exec(ctx.font);
        if (!m || Math.abs(parseFloat(m[1]) - px) > 0.51) {
          ctx.font = weight + ' ' + px + 'px sans-serif';
        }
      }

      function paint() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, size, size);
        setFont(fs);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = color;
        ctx.fillText(txt, ax, ay);
      }
      function inkBox() {
        var d;
        try { d = ctx.getImageData(0, 0, size, size).data; } catch (e) { return null; }
        var minX = -1, maxX = -1, minY = -1, maxY = -1;
        for (var y = 0; y < size; y++) {
          for (var x = 0; x < size; x++) {
            if (d[(y * size + x) * 4 + 3] > 8) {   /* 与官方实测同口径：官方背景204、阈值lum<200，等效覆盖率仅约2% */
              if (minX < 0) { minX = maxX = x; minY = maxY = y; }
              else {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }
        }
        if (minX < 0) return null;
        return { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
      }

      /* 迭代收敛：① 按墨迹高反算字号 ② 把墨迹中心挪到 canvas 中心（偏移量随字号等比缩放） */
      for (var it = 0; it < 6; it++) {
        paint();
        var b = inkBox();
        if (!b) return false;
        var ih = b.maxY - b.minY + 1;
        var k = target / ih;
        if (!isFinite(k) || k <= 0) return false;
        k = Math.max(0.5, Math.min(2, k));
        var icx = (b.minX + b.maxX) / 2, icy = (b.minY + b.maxY) / 2;
        var nfs = fs * k;
        var nax = ax + (C - ax) - k * (icx - ax);
        var nay = ay + (C - ay) - k * (icy - ay);
        var done = Math.abs(nfs - fs) < 0.05 && Math.abs(nax - ax) < 0.05 && Math.abs(nay - ay) < 0.05;
        fs = nfs; ax = nax; ay = nay;
        if (done) break;
      }
      paint();
      return true;
    }

    function layoutQtyNum() {
      var els = document.querySelectorAll('canvas.qty-num');
      for (var k = 0; k < els.length; k++) drawQtyNum(els[k]);
    }

    function updateQtyDisplay() {
      var els = document.querySelectorAll('canvas.qty-num');
      for (var i = 0; i < els.length; i++) els[i].dataset.q = couponCountEl.textContent;
      layoutQtyNum();
    }
    document.getElementById('decrease').addEventListener('click', () => {
      let count = parseInt(couponCountEl.textContent);
      if (count > 1) {
        couponCountEl.textContent = count - 1;
        updateQtyDisplay();
      }
    });
    document.getElementById('increase').addEventListener('click', () => {
      let count = parseInt(couponCountEl.textContent);
      if (count < 9) {
        couponCountEl.textContent = count + 1;
        updateQtyDisplay();
      }
    });

    function confirmCoupon() {
      closeCouponModal();
      openNotice();
    }

    /* ── 注册 Service Worker（离线可用 + Android 可安装） ── */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }

    /* ── 数字定位：首屏 + 尺寸变化时重算 ── */
    window.addEventListener('load', layoutQtyNum);
    window.addEventListener('resize', layoutQtyNum);
    window.addEventListener('orientationchange', function () {
      setTimeout(layoutQtyNum, 300);
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(layoutQtyNum).catch(function () {});
    }

    /* ── 彻底禁止手指滑动 / 缩放（点击照常触发） ── */
    document.addEventListener('touchstart', function () {}, { passive: true }); /* 让 iOS 生效 :active 按压态 */
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });

    /* ── 添加到主屏幕提示 ── */
    (function () {
      var isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: minimal-ui)').matches;
      if (isStandalone) return;                       // 已是桌面图标启动，不提示
      try { if (localStorage.getItem('umeda_tip_closed') === '1') return; } catch (e) {}

      var tip   = document.getElementById('installTip');
      var guide = document.getElementById('installGuide');
      var isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      document.getElementById('installGuideText').innerHTML = isiOS
        ? '<li>点击 Safari 底部中间的「分享」按钮（方框向上箭头）</li>' +
          '<li>在列表中向下找到「添加到主屏幕」</li>' +
          '<li>右上角点「添加」，桌面即出现「大丸・松坂屋」图标</li>'
        : '<li>点击浏览器右上角「⋮」菜单</li>' +
          '<li>选择「添加到主屏幕 / 安装应用」</li>' +
          '<li>确认后桌面即出现「大丸・松坂屋」图标</li>';

      setTimeout(function () { tip.classList.add('show'); }, 1200);
      setTimeout(function () {
        if (tip.classList.contains('show') && !guide.classList.contains('show')) {
          tip.classList.add('hide');
          setTimeout(function () { tip.classList.remove('show', 'hide'); }, 260);
        }
      }, 9000);

      document.getElementById('itHow').onclick = function () { guide.classList.add('show'); };
      document.getElementById('itClose').onclick = function () {
        try { localStorage.setItem('umeda_tip_closed', '1'); } catch (e) {}
        tip.classList.remove('show');
      };
      guide.onclick = function (e) { if (e.target === guide) guide.classList.remove('show'); };
      document.getElementById('igClose').onclick = function () { guide.classList.remove('show'); };
    })();
  </script>
</body>
</html>
