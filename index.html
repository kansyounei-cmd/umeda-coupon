<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>大丸・松坂屋</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-daimaru-192.png">
  <link rel="icon" sizes="192x192" href="icon-daimaru-192.png">
  <link rel="icon" sizes="512x512" href="icon-daimaru-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-daimaru-180.png">
  <link rel="apple-touch-icon" href="icon-daimaru-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="大丸・松坂屋">
  <meta name="application-name" content="大丸・松坂屋">
  <meta name="theme-color" content="#ffffff">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
  <meta name="referrer" content="no-referrer">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      touch-action: manipulation;
      -webkit-touch-callout: none;
    }
    .page {
      display: none;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .page.active {
      display: block;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    /* page1 点击区域 */
    #page1 .click-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
      pointer-events: auto;
    }
    /* page4 右侧 1/3 点击区域 */
    #page4 .right-third-click {
      position: absolute;
      top: 0;
      right: 0;
      width: 33.33%;
      height: 100%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
      pointer-events: auto;
    }
    /* 原有点击区域样式保留 */
    .page2-coupon-click, .page3-notice-area, .page5-click-area, #page6 .click-area {
      pointer-events: auto;
    }
    .btn-area {
      display: none;
    }
    .page2-coupon-click {
      position: absolute;
      top: 84%;
      left: 0;
      width: 100%;
      height: 12%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
    }
    .next-btn {
      position: absolute;
      background-color: rgba(44, 62, 80, 0.8);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      z-index: 20;
      top: 10px;
      right: 10px;
      pointer-events: auto;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: auto;
    }
    .modal-content {
      background-color: #fff;
      padding: 25px;
      border-radius: 8px;
      width: 80%;
      max-width: 400px;
      text-align: center;
      position: relative;
    }
     .modal-content p {
      font-weight: bold; /* 核心：字体加粗 */
      font-size: 18px; /* 可选：增大字体，更突出 */
      margin: 15px 0; /* 可选：调整上下间距 */
      margin-left: 10px;
    }
    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
      color: #666;
    }
    .modal-content h3 {
      margin-top: 0;
      color: #333;
    }
    .modal-content ul {
      text-align: left;
      margin: 15px 0;
      padding-left: 20px;
    }
    .modal-content li {
      margin-bottom: 10px;
      color: #333;
    }
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    .action-buttons button {
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    .agree-btn {
      background-color: #2c3e50;
      color: #fff;
    }
    .disagree-btn {
      background-color: #eee;
      color: #333;
    }
    .count-control {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 0 25px;
    }
    .count-control button {
      background-color: #f5f5f5;
      border: 1px solid #eee;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
    }
    .count-control span {
      margin: 0 25px;
      font-size: 20px;
      color: #333;
    }
    .confirm-btn {
      background-color: #2c3e50;
      color: #fff;
      border: none;
      padding: 10px 30px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }
    .barcode-page {
      position: relative;
    }
    /* 日期时间：竖排（rotate -90），日期和倒计时分居图中时钟图标两侧，JS 精确对位 */
    .time-display {
      position: absolute;
      top: 80%;
      left: 14%;
      display: flex;
      align-items: center;
      gap: 0.55em;
      color: #888;
      background-color: transparent;
      z-index: 10;
      transform: rotate(-90deg);
      transform-origin: top left;
      font-weight: 400;
      white-space: nowrap;
      pointer-events: none;
      line-height: 1;
      font-family: "PingFang SC", "Helvetica Neue", "Microsoft YaHei", "Heiti SC", sans-serif;
    }
    .td-date {
      font-size: 5.5vw;
      letter-spacing: -0.02em;
    }
    .td-gap {
      /* 让出图中自带的时钟图标位置 */
      flex: 0 0 auto;
      width: 6.6vw;
      align-self: center;
    }
    .td-time {
      font-size: 4.7vw;
      color: #667380;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }
    .td-time.expired {
      color: #ff0000;
    }
    #page3, #page5, #page6 {
      text-align: center;
      padding: 20px 0;
      position: relative;
    }
    #page3 img, #page5 img, #page6 img {
      max-width: 100%;
      margin: 0 auto;
    }
    .page3-notice-area {
      position: absolute;
      top: 40%;
      left: 10%;
      width: 80%;
      height: 30%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
    }
    .page5-click-area {
      position: absolute;
      top: 50.8%;
      left: 4.5%;
      width: 76%;
      height: 5.8%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
    }
    /* page6点击区域 */
    #page6 .click-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
    }
    /* page7点击区域（使用完成 → 点任意位置回首页） */
    #page7 .click-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      cursor: pointer;
      z-index: 10;
      pointer-events: auto;
    }
    /* page4 与 page6 共用 .time-display（见上），无需重复定义 */

    @media (max-width: 768px) {
      /* 字号已用 vw，随宽度自适应，无需覆写 */
    }

    /* ── 添加到主屏幕提示条（仅在浏览器中打开时出现，桌面图标启动时不显示） ── */
    #installTip {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 200;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      box-sizing: border-box;
      background: rgba(28, 38, 51, .94);
      color: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .28);
      font-family: "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.4;
      transition: opacity .25s ease, transform .25s ease;
    }
    #installTip.show { display: flex; }
    #installTip.hide { opacity: 0; transform: translateY(12px); }
    #installTip .it-ic {
      flex: 0 0 34px; width: 34px; height: 34px; border-radius: 8px;
      background: #fff url('icon-daimaru-180.png') center/contain no-repeat;
    }
    #installTip .it-tx { flex: 1 1 auto; }
    #installTip .it-tx b { display: block; font-size: 13px; font-weight: 600; }
    #installTip .it-tx span { display: block; font-size: 11.5px; opacity: .78; margin-top: 2px; }
    #installTip .it-btn {
      flex: 0 0 auto; border: 0; border-radius: 999px; padding: 7px 12px;
      background: #d8cb84; color: #2b3d4f; font-size: 12.5px; font-weight: 700;
      cursor: pointer; pointer-events: auto;
    }
    #installTip .it-close {
      flex: 0 0 auto; border: 0; background: transparent; color: rgba(255,255,255,.6);
      font-size: 20px; line-height: 1; padding: 0 2px; cursor: pointer; pointer-events: auto;
    }
    #installGuide {
      position: fixed; inset: 0; z-index: 300; display: none;
      background: rgba(0,0,0,.55); align-items: flex-end; justify-content: center;
    }
    #installGuide.show { display: flex; }
    #installGuide .ig-box {
      width: 100%; max-width: 420px; background: #fff; color: #2b3d4f;
      border-radius: 16px 16px 0 0; padding: 18px 18px calc(20px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box; font-family: "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    }
    #installGuide h4 { margin: 0 0 10px; font-size: 16px; }
    #installGuide ol { margin: 0; padding-left: 20px; font-size: 13.5px; line-height: 1.9; }
    #installGuide .ig-close {
      margin-top: 14px; width: 100%; border: 0; border-radius: 10px; padding: 12px;
      background: #2b3d4f; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page active" id="page1">
    <img 
      src="page1.jpg" 
      alt="优惠券列表" 
    >
    <div class="click-area" onclick="switchPage('page1', 'page2')"></div>
  </div>

  <div class="page" id="page2">
    <img 
      src="page2.jpg" 
      alt="优惠券详细信息"
    >
    <div 
      class="page2-coupon-click" 
      onclick="openCouponModal()"
    ></div>
  </div>

  </div>

  <div class="page" id="page5">
    <img 
      src="page5.jpg" 
      alt="优惠券确认页"
    >
    <div class="page5-click-area" onclick="switchPage('page5', 'page4')"></div>
  </div>

  <div class="page" id="page4">
    <!-- 右侧1/3点击区域，直接跳转page6 -->
    <div class="right-third-click" onclick="switchPage('page4', 'page6')"></div>
    <div class="barcode-page">
      <img 
        src="page4.png" 
        alt="优惠券条码"
      >
      <div class="time-display" id="page4TimeDisplay"></div>
    </div>
  </div>

  <!-- 新增page6页面 -->
  <div class="page" id="page6">
    <img 
      src="page6.png" 
      alt="优惠券使用完成页"
    >
    <div class="time-display" id="page6TimeDisplay"></div>
    <div class="click-area" onclick="switchPage('page6', 'page7')"></div>
  </div>
  
  <div class="page" id="page7">
    <img 
      src="page7.jpg" 
      alt="优惠券使用完成页"
    >
    <div class="click-area" onclick="switchPage('page7', 'page1')"></div>
  </div>

  <div class="modal" id="couponModal">
    <div class="modal-content">
      <span class="close-modal" id="closeModal" onclick="closeCouponModal()">&times;</span>
      <p>请选择要使用的张数。</p>
      <div class="count-control">
        <button id="decrease">-</button>
        <span id="couponCount">1</span>
        <button id="increase">+</button>
      </div>
      <button class="confirm-btn" onclick="confirmCoupon()">确认</button>
    </div>
  </div>

  <div id="installTip">
    <div class="it-ic"></div>
    <div class="it-tx">
      <b>添加到主屏幕，像 App 一样打开</b>
      <span>名称：大丸・松坂屋　图标与「大丸心斎橋」一致</span>
    </div>
    <button class="it-btn" id="itHow" type="button">方法</button>
    <button class="it-close" id="itClose" type="button" aria-label="关闭">&times;</button>
  </div>

  <div id="installGuide">
    <div class="ig-box">
      <h4>添加到主屏幕的方法</h4>
      <ol id="installGuideText"></ol>
      <button class="ig-close" id="igClose" type="button">知道了</button>
    </div>
  </div>

  <script>
    let countdownInterval; 
    let remainingSeconds = 10 * 60; // 10分钟倒计时
    const TOTAL_SECONDS = remainingSeconds; 

    function switchPage(fromPageId, toPageId) {
      document.getElementById(fromPageId).classList.remove('active');
      document.getElementById(toPageId).classList.add('active');
      
      if (toPageId === 'page4') {
        startCountdown();
      } else if (toPageId === 'page6') {
        updatePage6Time();
      } else {
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
      }
      if (toPageId === 'page4' || toPageId === 'page6') {
        layoutClock();
      }
    }

    function startCountdown() {
      remainingSeconds = TOTAL_SECONDS;
      
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      updatePage4Time(remainingSeconds);
      updatePage6Time();

      countdownInterval = setInterval(() => {
        remainingSeconds--;
        updatePage4Time(remainingSeconds);
        updatePage6Time();

        if (remainingSeconds <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          document.querySelectorAll('.td-time').forEach(function (el) { el.classList.add('expired'); });
          // 倒计时结束自动跳转page6
          switchPage('page4', 'page7');
        }
      }, 1000);
    }

    /* ── 日期时间渲染：日期和倒计时分居图中时钟图标两侧 ── */
    const CLOCK_POS = { x: 0.226, y: 0.6657 }; // 时钟图标在 page4/page6 图中的相对位置（两图实测一致）

    function dateStr() {
      const now = new Date();
      return now.getFullYear() + '/' +
        String(now.getMonth() + 1).padStart(2, '0') + '/' +
        String(now.getDate()).padStart(2, '0');
    }

    function timeHTML() {
      const m = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
      const s = String(remainingSeconds % 60).padStart(2, '0');
      return '<span class="td-date">' + dateStr() + '</span>' +
             '<span class="td-gap"></span>' +
             '<span class="td-time">' + m + ':' + s + '</span>';
    }

    function updatePage4Time(seconds) {
      const now = new Date();
      const ds = now.getFullYear() + '/' +
        String(now.getMonth() + 1).padStart(2, '0') + '/' +
        String(now.getDate()).padStart(2, '0');
      const minutes = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      document.getElementById('page4TimeDisplay').innerHTML =
        '<span class="td-date">' + ds + '</span>' +
        '<span class="td-gap"></span>' +
        '<span class="td-time">' + minutes + ':' + secs + '</span>';
    }

    function updatePage6Time() {
      document.getElementById('page6TimeDisplay').innerHTML = timeHTML();
    }

    /* 把 .td-gap 精确对到图中时钟图标上（日期在下、时间在上） */
    function layoutClock() {
      ['page4TimeDisplay', 'page6TimeDisplay'].forEach(function (id) {
        const el = document.getElementById(id);
        if (!el || !el.innerHTML) return;
        const page = el.closest('.page');
        if (!page || !page.classList.contains('active')) return;
        const img = page.querySelector('img');
        const gap = el.querySelector('.td-gap');
        if (!img || !gap) return;
        const ir = img.getBoundingClientRect();
        const gr = gap.getBoundingClientRect();
        const tx = ir.left + CLOCK_POS.x * ir.width;
        const ty = ir.top + CLOCK_POS.y * ir.height;
        const dx = tx - (gr.left + gr.width / 2);
        const dy = ty - (gr.top + gr.height / 2);
        if (dx || dy) {
          const cs = getComputedStyle(el);
          el.style.left = (parseFloat(cs.left) + dx) + 'px';
          el.style.top = (parseFloat(cs.top) + dy) + 'px';
        }
      });
    }
    window.addEventListener('resize', layoutClock);

    function openCouponModal() {
      document.getElementById('couponModal').style.display = 'flex';
    }

    function closeCouponModal() {
      document.getElementById('couponModal').style.display = 'none';
    }

    const couponCountEl = document.getElementById('couponCount');
    document.getElementById('decrease').addEventListener('click', () => {
      let count = parseInt(couponCountEl.textContent);
      if (count > 1) {
        couponCountEl.textContent = count - 1;
      }
    });
    document.getElementById('increase').addEventListener('click', () => {
      let count = parseInt(couponCountEl.textContent);
      if (count < 9) {
        couponCountEl.textContent = count + 1;
      }
    });

    function confirmCoupon() {
      closeCouponModal();
      switchPage('page2', 'page5');
    }

    /* ── 注册 Service Worker（离线可用 + Android 可安装） ── */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }

    /* ── 添加到主屏幕提示 ── */
    (function () {
      var isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: minimal-ui)').matches;
      if (isStandalone) return;                       // 已是桌面图标启动，不提示
      try { if (localStorage.getItem('umeda_tip_closed') === '1') return; } catch (e) {}

      var tip   = document.getElementById('installTip');
      var guide = document.getElementById('installGuide');
      var isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      document.getElementById('installGuideText').innerHTML = isiOS
        ? '<li>点击 Safari 底部中间的「分享」按钮（方框向上箭头）</li>' +
          '<li>在列表中向下找到「添加到主屏幕」</li>' +
          '<li>右上角点「添加」，桌面即出现「大丸・松坂屋」图标</li>'
        : '<li>点击浏览器右上角「⋮」菜单</li>' +
          '<li>选择「添加到主屏幕 / 安装应用」</li>' +
          '<li>确认后桌面即出现「大丸・松坂屋」图标</li>';

      setTimeout(function () { tip.classList.add('show'); }, 1200);
      setTimeout(function () {
        if (tip.classList.contains('show') && !guide.classList.contains('show')) {
          tip.classList.add('hide');
          setTimeout(function () { tip.classList.remove('show', 'hide'); }, 260);
        }
      }, 9000);

      document.getElementById('itHow').onclick = function () { guide.classList.add('show'); };
      document.getElementById('itClose').onclick = function () {
        try { localStorage.setItem('umeda_tip_closed', '1'); } catch (e) {}
        tip.classList.remove('show');
      };
      guide.onclick = function (e) { if (e.target === guide) guide.classList.remove('show'); };
      document.getElementById('igClose').onclick = function () { guide.classList.remove('show'); };
    })();
  </script>
</body>
</html>
